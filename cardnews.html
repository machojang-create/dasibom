<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건강 카드뉴스 — 다시봄라이프</title>
<meta name="description" content="블로그 핵심 건강 정보를 한 장씩 읽기 쉽게 정리했습니다.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e9d7d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --cream:#F5F1E8;
  --cream-2:#EDE7D7;
  --paper:#FBF8F0;
  --ink:#1F2A1A;
  --ink-2:#2D3A2A;
  --muted:#6B6B5C;
  --sage:#5C7A4A;
  --sage-deep:#3F5A30;
  --gold:#C9A961;
  --gold-soft:#E0C988;
  --line:rgba(45,58,42,0.14);
  --r-lg:24px;
  --r-md:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
body{font-family:"Pretendard","Pretendard Variable",-apple-system,system-ui,sans-serif;line-height:1.55;overflow-x:hidden}
.serif{font-family:"Nanum Myeongjo",serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}

/* ── 헤더 ── */
.hdr{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  height:60px;padding:0 20px;
  background:rgba(245,241,232,0.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.hdr-back{
  display:flex;align-items:center;gap:6px;font-size:15px;color:var(--sage-deep);font-weight:600;
  padding:8px 12px 8px 6px;border-radius:999px;
  transition:background .2s;
}
.hdr-back:hover{background:var(--cream-2)}
.hdr-back svg{flex-shrink:0}
.hdr-title{font-size:17px;font-weight:700;color:var(--ink)}

/* ── 탭 ── */
.tabs{
  display:flex;gap:8px;padding:18px 20px 10px;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;padding:9px 18px;border-radius:999px;font-size:15px;font-weight:600;
  border:2px solid transparent;background:var(--paper);color:var(--muted);
  transition:all .18s;
}
.tab.active{background:var(--sage-deep);color:#fff;border-color:var(--sage-deep)}
.tab:not(.active):hover{border-color:var(--sage);color:var(--sage)}

/* ── 안내 텍스트 ── */
.intro{padding:4px 20px 18px;font-size:15px;color:var(--muted)}

/* ── 시리즈 그리드 ── */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:0 20px 32px;
}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}

.series-card{
  border-radius:var(--r-lg);padding:20px 18px 16px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform .18s,box-shadow .18s;
  box-shadow:0 4px 14px -6px rgba(45,58,42,.18);
  min-height:160px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.series-card:active{transform:scale(.97)}
@media(hover:hover){.series-card:hover{transform:translateY(-4px);box-shadow:0 10px 28px -10px rgba(45,58,42,.28)}}

.sc-cat{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:8px}
.sc-emoji{font-size:28px;margin-bottom:10px;line-height:1}
.sc-title{font-family:"Nanum Myeongjo",serif;font-size:17px;font-weight:700;line-height:1.3;color:var(--ink)}
.sc-sub{font-size:13px;margin-top:6px;opacity:.7;line-height:1.4}
.sc-count{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:600;color:var(--sage-deep);
  background:rgba(255,255,255,.55);border-radius:999px;
  padding:4px 10px;margin-top:14px;
}

/* 카드 색상 팔레트 (기존 홈과 통일) */
.sc-c0{background:#FFEFE2}.sc-c1{background:#E6F6EC}.sc-c2{background:#FFF6DA}
.sc-c3{background:#E9F1FF}.sc-c4{background:#FFE9EC}.sc-c5{background:#EFE6FF}
.sc-c6{background:#FFF3E0}.sc-c7{background:#E4F3EE}.sc-c8{background:#FFE3E3}
.sc-c9{background:#ECE6F6}

/* ── 리더 모달 ── */
.reader{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;
  background:var(--ink);
  transition:opacity .22s;
}
.reader.hidden{display:none}

.reader-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;flex-shrink:0;
}
.reader-close{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.12);color:#fff;font-size:20px;
  transition:background .15s;
}
.reader-close:hover{background:rgba(255,255,255,.22)}
.reader-series-title{font-size:14px;color:rgba(255,255,255,.7);max-width:60%;text-align:center;line-height:1.3}

/* 진행 도트 */
.dots{
  display:flex;justify-content:center;gap:6px;
  padding:10px 20px 0;flex-shrink:0;
}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.3);
  transition:all .2s;
}
.dot.active{width:22px;border-radius:3px;background:#fff}

/* 슬라이드 뷰포트 */
.slides-viewport{
  flex:1;overflow:hidden;position:relative;
}
.slides-track{
  display:flex;height:100%;
  transition:transform .3s cubic-bezier(.25,.46,.45,.94);
}
.slide{
  min-width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 28px 20px;
  text-align:center;
}

/* 슬라이드 타입별 스타일 */
.slide-stat .stat-number{
  font-family:"Nanum Myeongjo",serif;
  font-size:clamp(56px,15vw,88px);font-weight:800;
  color:var(--gold-soft);line-height:1;margin-bottom:12px;
}
.slide-stat .stat-label{font-size:18px;color:rgba(255,255,255,.9);line-height:1.5;max-width:22ch}
.slide-stat .stat-src{font-size:12px;color:rgba(255,255,255,.42);margin-top:16px}

.slide-info .slide-icon{font-size:36px;margin-bottom:16px}
.slide-info .slide-title,.slide-tip .slide-title{
  font-family:"Nanum Myeongjo",serif;font-size:22px;font-weight:700;
  color:#fff;margin-bottom:14px;line-height:1.35;
}
.slide-info .slide-body,.slide-tip .slide-body{
  font-size:17px;color:rgba(255,255,255,.85);line-height:1.75;max-width:30ch;
}
.slide-tip{border:1px solid rgba(201,169,97,.4)}
.slide-tip .tip-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold-soft);border:1px solid var(--gold-soft);
  border-radius:999px;padding:5px 14px;margin-bottom:18px;
}

.slide-cta{background:var(--sage-deep)}
.slide-cta .cta-title{
  font-family:"Nanum Myeongjo",serif;font-size:22px;font-weight:700;
  color:#fff;margin-bottom:10px;
}
.slide-cta .cta-sub{font-size:15px;color:rgba(255,255,255,.8);margin-bottom:28px}
.slide-cta .cta-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:15px 28px;border-radius:999px;
  background:#fff;color:var(--sage-deep);font-size:16px;font-weight:700;
  transition:transform .15s,box-shadow .15s;
  text-decoration:none;
}
.slide-cta .cta-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.slide-cta .or-text{font-size:13px;color:rgba(255,255,255,.5);margin:16px 0 0}
.slide-cta .restart-btn{
  font-size:14px;color:rgba(255,255,255,.65);margin-top:8px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;
}

/* 네비 버튼 (데스크탑용) */
.reader-nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 24px 20px;flex-shrink:0;gap:12px;
}
.nav-btn{
  flex:1;padding:14px;border-radius:var(--r-md);
  font-size:16px;font-weight:600;
  background:rgba(255,255,255,.1);color:#fff;
  transition:background .15s;max-width:140px;
}
.nav-btn:hover{background:rgba(255,255,255,.18)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn.next{background:var(--sage);max-width:none;flex:2}
.nav-btn.next:hover{background:var(--sage-deep)}

/* 빈 상태 */
.empty{
  padding:60px 20px;text-align:center;
  font-size:17px;color:var(--muted);
}
</style>
</head>
<body>

<!-- 헤더 -->
<header class="hdr">
  <a class="hdr-back" href="/health">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M12 5l-5 5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    건강 돋보기
  </a>
  <span class="hdr-title">건강 카드뉴스</span>
  <div style="width:116px"></div><!-- 균형 맞춤 -->
</header>

<!-- 탭 -->
<nav class="tabs" role="tablist" aria-label="카테고리 선택">
  <button class="tab active" data-cat="전체" role="tab" aria-selected="true">전체 18편</button>
  <button class="tab" data-cat="영양건강" role="tab" aria-selected="false">영양건강 10편</button>

<p class="intro">블로그 핵심 내용을 한 장씩 넘겨보세요. 시리즈 하나당 6장 분량입니다.</p>

<!-- 시리즈 그리드 -->
<main class="grid" id="grid" role="list"></main>

<!-- 카드 리더 모달 -->
<div class="reader hidden" id="reader" role="dialog" aria-modal="true" aria-label="카드뉴스 리더">
  <div class="reader-hdr">
    <button class="reader-close" id="readerClose" aria-label="닫기">✕</button>
    <span class="reader-series-title" id="readerTitle"></span>
    <div style="width:40px"></div>

  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="slides-viewport" id="viewport">

  </div>
  <div class="reader-nav">
    <button class="nav-btn prev" id="btnPrev" aria-label="이전">← 이전</button>
    <button class="nav-btn next" id="btnNext" aria-label="다음">다음 →</button>
  </div>
</div>

// ── 상태 ──────────────────────────────────────────────────
let currentSeries = null;
let currentIdx = 0;
let startX = 0;
let isDragging = false;

// ── 그리드 렌더 ──────────────────────────────────────────
function renderGrid(cat) {
  const grid = document.getElementById('grid');
  const filtered = cat === '전체' ? SERIES : SERIES.filter(s => s.cat === cat);
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">해당 카테고리에 카드뉴스가 없습니다.</div>';
    return;
  }
  grid.innerHTML = filtered.map((s, i) => `
    <article class="series-card sc-c${s.color}" role="listitem"
      tabindex="0" aria-label="${s.title} — ${s.cards.length}장"
      onclick="openReader('${s.id}')" onkeydown="if(event.key==='Enter')openReader('${s.id}')">
      <div>
        <div class="sc-cat">${s.cat}</div>
        <div class="sc-emoji" aria-hidden="true">${s.emoji}</div>
        <h2 class="sc-title">${s.title}</h2>
        <p class="sc-sub">${s.sub}</p>
      </div>
      <div class="sc-count" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x=".5" y=".5" width="12" height="12" rx="2.5" stroke="currentColor"/><path d="M3 4.5h7M3 6.5h7M3 8.5h4" stroke="currentColor" stroke-linecap="round"/></svg>
        ${s.cards.length}장
      </div>
    </article>
  `).join('');
}

// ── 리더 열기 ─────────────────────────────────────────────
function openReader(id) {
  currentSeries = SERIES.find(s => s.id === id);
  currentIdx = 0;
  if (!currentSeries) return;

  document.getElementById('readerTitle').textContent = currentSeries.title;
  buildDots();
  buildTrack();
  updateReader();

  const reader = document.getElementById('reader');
  reader.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  document.getElementById('readerClose').focus();
}

function closeReader() {
  document.getElementById('reader').classList.add('hidden');
  document.body.style.overflow = '';
  currentSeries = null;
}

// ── 슬라이드 빌드 ────────────────────────────────────────
function buildDots() {
  const n = currentSeries.cards.length;
  document.getElementById('dots').innerHTML =
    Array.from({length:n}, (_,i) => `<div class="dot ${i===0?'active':''}" id="dot${i}"></div>`).join('');
}

function buildTrack() {
  const track = document.getElementById('track');
  track.innerHTML = currentSeries.cards.map((c,i) => buildSlide(c,i)).join('');
}

function buildSlide(c, i) {
  if (c.t === 'stat') return `
    <div class="slide slide-stat" aria-label="슬라이드 ${i+1}">
      <div class="stat-number serif">${c.num}</div>
      <div class="stat-label">${c.label}</div>
      <div class="stat-src">${c.src}</div>
    </div>`;

  if (c.t === 'info') return `
    <div class="slide slide-info" aria-label="슬라이드 ${i+1}">
      <div class="slide-icon" aria-hidden="true">${c.icon}</div>
      <h3 class="slide-title serif">${c.title}</h3>
      <p class="slide-body">${c.body}</p>
    </div>`;

  if (c.t === 'tip') return `
    <div class="slide slide-tip" aria-label="슬라이드 ${i+1}">
      <div class="tip-badge">★ 핵심 실천법</div>
      <h3 class="slide-title serif">${c.title}</h3>
      <p class="slide-body">${c.body}</p>
    </div>`;

  if (c.t === 'cta') {
    const href = c.direct || 'https://blog.naver.com/machojang';
    return `
      <div class="slide slide-cta" aria-label="마지막 슬라이드 ${i+1}">
        <h3 class="cta-title serif">${c.title}</h3>
        <p class="cta-sub">${c.sub}</p>
        <a class="cta-btn" href="${href}" target="${c.direct?'_self':'_blank'}" rel="noopener">
          ${c.direct ? '게임 하러 가기 →' : '블로그에서 읽기 →'}
        </a>
        <p class="or-text">또는</p>
        <button class="restart-btn" onclick="goTo(0)">처음부터 다시 보기</button>
      </div>`;
  }
  return '';
}

// ── 네비게이션 ───────────────────────────────────────────
function goTo(idx) {
  if (!currentSeries) return;
  const n = currentSeries.cards.length;
  currentIdx = Math.max(0, Math.min(n - 1, idx));
  updateReader();
}

function updateReader() {
  const n = currentSeries.cards.length;
  const track = document.getElementById('track');
  track.style.transform = `translateX(-${currentIdx * 100}%)`;

  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i === currentIdx));

  document.getElementById('btnPrev').disabled = currentIdx === 0;
  const nextBtn = document.getElementById('btnNext');
  nextBtn.disabled = false;
  nextBtn.textContent = currentIdx === n - 1 ? '닫기 ✕' : '다음 →';
}

document.getElementById('btnPrev').onclick = () => goTo(currentIdx - 1);
document.getElementById('btnNext').onclick = () => {
  if (currentIdx === currentSeries.cards.length - 1) closeReader();
  else goTo(currentIdx + 1);
};
document.getElementById('readerClose').onclick = closeReader;

// 키보드 네비
document.addEventListener('keydown', e => {
  if (!currentSeries) return;
  if (e.key === 'ArrowRight') goTo(currentIdx + 1);
  if (e.key === 'ArrowLeft') goTo(currentIdx - 1);
  if (e.key === 'Escape') closeReader();
});

// 터치 스와이프
const viewport = document.getElementById('viewport');
viewport.addEventListener('touchstart', e => { startX = e.touches[0].clientX; isDragging = true; }, {passive:true});
viewport.addEventListener('touchend', e => {
  if (!isDragging) return;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 40) dx < 0 ? goTo(currentIdx + 1) : goTo(currentIdx - 1);
  isDragging = false;
}, {passive:true});

// ── 탭 ────────────────────────────────────────────────────
let activeCat = '전체';
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.remove('active');
      t.setAttribute('aria-selected','false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-selected','true');
    activeCat = btn.dataset.cat;
    renderGrid(activeCat);
  });
});

// ── 초기 렌더 ─────────────────────────────────────────────
renderGrid('전체');
</script>
