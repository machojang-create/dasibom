name: 블로그 이미지 생성

# 수동으로만 돌립니다. 이미지 생성에는 Gemini 호출 비용이 들기 때문에
# 자동으로 도는 일이 없어야 합니다.
#
# 쓰는 법: GitHub 저장소 → Actions → "블로그 이미지 생성" → Run workflow
#
# 최초 1회만: Settings → Secrets and variables → Actions → New repository secret
#   이름  GEMINI_API_KEY
#   값    노트북의 tools/gemini.key 안에 있는 키 한 줄
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '이번에 뽑을 일러스트 장수 (0 = 남은 것 전부)'
        required: true
        default: '3'
      post:
        description: '특정 원고만 (예: B01). 비우면 전체'
        required: false
        default: ''
      force:
        description: '이미 있는 그림도 다시 뽑기 (화풍을 바꾼 뒤에만)'
        type: boolean
        required: false
        default: false

# 결과를 저장소에 커밋해야 노트북에서 git pull 로 받아 쓸 수 있습니다.
permissions:
  contents: write

concurrency:
  group: blog-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 카드 이미지에 한글을 그리려면 폰트가 있어야 합니다.
      # 없으면 글자가 네모로 나옵니다.
      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f
          fc-list :lang=ko family | head -3

      - name: 패키지 설치
        working-directory: blog
        run: npm install --no-audit --no-fund

      - name: 대표 이미지와 정보 카드
        working-directory: blog
        # 둘 다 직접 그리는 것이라 호출 비용이 없습니다. 항상 전체를 다시 뽑습니다.
        run: |
          set -e
          for f in out/*.json; do
            [ -e "$f" ] || continue
            node gen_image.mjs --post "$f" >/dev/null
          done
          node gen_figures.mjs --all

      - name: 일러스트 생성 (Gemini)
        working-directory: blog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY 시크릿이 없습니다."
            echo "Settings → Secrets and variables → Actions → New repository secret 에서"
            echo "GEMINI_API_KEY 라는 이름으로 키를 넣어 주세요."
            exit 1
          fi

          ARGS=""
          if [ -n "${{ inputs.post }}" ]; then
            FILE=$(ls out/${{ inputs.post }}_*.json 2>/dev/null | head -1)
            if [ -z "$FILE" ]; then
              echo "::error::${{ inputs.post }} 로 시작하는 원고를 못 찾았습니다."
              exit 1
            fi
            ARGS="--post $FILE"
          else
            ARGS="--all"
          fi

          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "실행: node gen_illust.mjs $ARGS"
          node gen_illust.mjs $ARGS

      - name: 검수
        working-directory: blog
        run: node lint_post.mjs --all

      - name: 결과 정리
        id: summary
        working-directory: blog
        run: |
          ILL=$(ls out/illust/*.jpg 2>/dev/null | wc -l)
          FIG=$(ls out/figs/*.png 2>/dev/null | wc -l)
          COVER=$(ls out/*.png 2>/dev/null | wc -l)
          echo "ill=$ILL" >> "$GITHUB_OUTPUT"
          {
            echo "## 이미지 현황"
            echo ""
            echo "| | 장수 |"
            echo "|---|---|"
            echo "| 일러스트 | $ILL |"
            echo "| 정보 카드 | $FIG |"
            echo "| 대표 이미지 | $COVER |"
            echo ""
            echo "노트북에서 \`git pull\` 하시면 그림이 내려옵니다."
          } >> "$GITHUB_STEP_SUMMARY"

      # 저장소에 커밋하기 전에 눈으로 먼저 보실 수 있게 올려 둡니다.
      - name: 그림을 내려받을 수 있게 올리기
        uses: actions/upload-artifact@v4
        with:
          name: blog-images
          path: |
            blog/out/illust/
            blog/out/figs/
          if-no-files-found: warn
          retention-days: 14

      - name: 저장소에 커밋
        run: |
          if [ -z "$(git status --porcelain blog/out)" ]; then
            echo "새로 만들어진 이미지가 없습니다. 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/out
          git commit -m "blog: 이미지 생성 (일러스트 ${{ steps.summary.outputs.ill }}장)"
          git push
