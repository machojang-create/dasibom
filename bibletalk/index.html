<script>
/* ── 날짜·시각 (검증 오버라이드: ?date=YYYY-MM-DD & ?hour=N) ── */
const Q = new URLSearchParams(location.search);
function now(){ const d = Q.get('date') ? new Date(Q.get('date')+'T12:00:00') : new Date();
  if(Q.get('hour')!=null) d.setHours(+Q.get('hour')); return d; }
function doy(d){ return Math.floor((d - new Date(d.getFullYear(),0,0)) / 864e5); } // 1~365(윤년 366은 365로 접음)
function todayKey(d){ return d.toISOString ? d.toISOString().slice(0,10) : ''; }

/* ── 상태 (localStorage 영속) ── */
const DEF = { steps:0, lastDay:null, listened:{}, copied:{}, copyCount:0, cards:[], amens:{}, prayers:[] };
let P; try{ P = Object.assign({}, DEF, JSON.parse(localStorage.getItem('bt3')||'{}')); }catch(e){ P = {...DEF}; }
const save = () => { try{ localStorage.setItem('bt3', JSON.stringify(P)); }catch(e){} };

const S = { tab:'today', dawnManual:null, playing:false, emotion:null, guestOpen:false, storyOpen:false, copyText:'', journeyOpen:null, toast:'' };
const esc = t => String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 창고 ── */
const D = {}; // verses, guests, scenes, journeys, dawn, emotions
async function loadAll(){
  const files = { verses:'data/verses365.json', guests:'data/guests.json', scenes:'data/scenes52.json',
    journeys:'data/journeys.json', dawn:'data/dawn.json', emotions:'data/emotions.json' };
  await Promise.all(Object.entries(files).map(async ([k,f])=>{ D[k] = await (await fetch(f)).json(); }));
}

/* ── 오늘 항목 계산 ── */
const dayIdx = () => (doy(now()) - 1) % 365;
const verseToday = () => D.verses[dayIdx()];
const guestToday = () => D.guests[dayIdx() % D.guests.length];
const weekNo = () => Math.floor(dayIdx() / 7) % 52 + 1;
const sceneToday = () => D.scenes[weekNo() - 1];
function isDawn(){ if(S.dawnManual!=null) return S.dawnManual; const h = now().getHours(); return D.dawn.hours.includes(h); }

/* 출석: 오늘 첫 접속이면 순례 한 걸음 */
function checkin(){
  const k = todayKey(now());
  if(P.lastDay !== k){ P.lastDay = k; P.steps++; P.days = P.days || {}; P.days[k] = 1; save(); }
}
/* 연속 출석 — 하루 빈 날은 한 달에 한 번 '은혜로 이음'(벌 대신 품어주는 설계) */
function streakInfo(){
  const days = P.days || {};
  const d = now(); let streak = 0, mended = false;
  let canMend = (P.mendMonth !== todayKey(now()).slice(0,7));
  for (let i = 0; i < 366; i++) {
    const dd = new Date(d); dd.setDate(d.getDate() - i);
    const k = dd.toISOString().slice(0,10);
    if (days[k]) { streak++; continue; }
    if (i === 0) continue;                       // 오늘 아직 미접속 케이스는 건너뜀
    if (canMend && !mended) { mended = true; streak++; continue; }  // 하루 공백은 은혜로 이음
    break;
  }
  if (mended && P.mendMonth !== todayKey(now()).slice(0,7)) { P.mendMonth = todayKey(now()).slice(0,7); save(); }
  return { streak, mended };
}
function weekStats(){
  const d = now(); const days = P.days || {};
  const dow = d.getDay();                        // 이번 주 일요일부터
  let att = 0, listen = 0, copyN = 0;
  for (let i = 0; i <= dow; i++) {
    const dd = new Date(d); dd.setDate(d.getDate() - (dow - i));
    const k = dd.toISOString().slice(0,10);
    if (days[k]) att++;
    if (P.listened[k]) listen++;
    if (P.copied[k]) copyN++;
  }
  return { att, listen, copyN, isSunday: dow === 0 };
}
/* 나무: 물 = 오늘 들은/필사한 활동 수. 레벨 = 총 활동 누적 기반 */
function acts(){ return Object.keys(P.listened).length + P.copyCount; }
function treeState(){
  const total = acts();
  const level = Math.min(3, Math.floor(total / 3));
  return { level, water: total % 3, birds: Math.min(6, level + (total>=12 ? Math.floor((total-9)/6) : 0)) };
}
function 급수(kind){
  const k = todayKey(now());
  const lvBefore = treeState().level;
  if(kind==='listen'){ if(P.listened[k]) return; P.listened[k]=1; }
  if(kind==='copy'){ if(P.copied[k]) return; P.copied[k]=1; P.copyCount++;
    try{ window.DasibomPoints && DasibomPoints.earn('bible'); }catch(e){} } // 다시봄 편입 시 꽃잎 보상(서버 지급, 하루 1회)
  save();
  const grew = treeState().level > lvBefore;
  S.treeFx = grew ? 'pop' : '';
  render();
  if (S.tab === 'today') {
    particles('drop');                       // 물방울
    if (grew) { setTimeout(() => particles('burst'), 450); FXS('reward'); } // 성장 축포
    else FXS('bubble');
  } else if (kind === 'copy') {
    particles('sparkle', 'copy-done-box'); FXS('reward');   // 필사 완료 반짝임
  }
  if (grew) setTimeout(() => { S.treeFx = ''; }, 900);
}
/* 다시봄 호스트에서만 포인트·봄이 음성·효과음 모듈 로드(트로트 패턴) */

}

const NAME_CATH = { '바울':'바오로','베드로':'베드로','마태':'마태오','요한(사도)':'요한','세례 요한':'세례자 요한',

const 병기 = n => NAME_CATH[n] && NAME_CATH[n] !== n ? `${n}(${NAME_CATH[n]})` : n;
/* ── 인물 도감 — 만난 손님 모음 ── */
const INIT_COLORS = ['#5E7355','#C08B3E','#6E9BC0','#93859F','#A8875A','#7C9A6D'];
function vGuestbook(){
  const met = D.guests.filter(g => P.cards.includes(g.name));
  const rows = met.map((g, i) => { const im = GUEST_IMG[g.name];
    return `<div class="card" style="display:flex;align-items:center;overflow:hidden">
      ${im?`<img src="img/${im}" style="width:64px;height:72px;object-fit:cover;flex:none" alt="">`
          :`<div style="width:64px;height:72px;flex:none;display:flex;align-items:center;justify-content:center;background:${INIT_COLORS[i%INIT_COLORS.length]}"><span class="serif" style="font-size:26px;font-weight:700;color:#FFFDF7">${esc(g.name[0])}</span></div>`}
      <div style="padding:10px 14px;min-width:0">
        <div style="font:500 13.5px 'Noto Sans KR'">${esc(병기(g.name))} <span class="cap" style="font-size:11px">· ${esc(g.tag)}</span></div>
        <div class="cap" style="margin-top:4px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">"${esc(g.greet)}"</div>
      </div>

/* ── 말씀카드 만들기: 명화+오늘 구절을 이미지로 저장·공유 ── */
async function 말씀카드(){
  const v = verseToday();
  const vimg = VERSE_IMG[dayIdx() % VERSE_IMG.length];
  const W = 1080, H = 1350;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#F6F2EA'; cx.fillRect(0, 0, W, H);
  try {
    const im = new Image(); im.src = 'img/' + vimg;
    await new Promise((r, j) => { im.onload = r; im.onerror = j; });
    // 상단 58% 영역에 cover로
    const ah = H * 0.58, ar = W / ah, ir = im.width / im.height;
    let sw = im.width, sh = im.height, sx = 0, sy = 0;
    if (ir > ar) { sw = im.height * ar; sx = (im.width - sw) / 2; } else { sh = im.width / ar; sy = (im.height - sh) / 2; }
    cx.drawImage(im, sx, sy, sw, sh, 0, 0, W, ah);
    const g = cx.createLinearGradient(0, ah - 200, 0, ah);
    g.addColorStop(0, 'rgba(246,242,234,0)'); g.addColorStop(1, '#F6F2EA');
    cx.fillStyle = g; cx.fillRect(0, ah - 200, W, 200);
  } catch(e) {}
  // 구절(명조, 줄바꿈)
  cx.fillStyle = '#1F2420'; cx.textAlign = 'center';
  cx.font = '600 52px "Nanum Myeongjo", serif';
  const words = v.text.split(' ');
  const lines = []; let line = '';
  for (const w2 of words) { const t = line ? line + ' ' + w2 : w2;
    if (cx.measureText(t).width > W - 160) { lines.push(line); line = w2; } else line = t; }
  if (line) lines.push(line);
  let y = H * 0.58 + 60;
  for (const ln of lines.slice(0, 7)) { cx.fillText(ln, W / 2, y); y += 78; }
  cx.font = '400 34px "Noto Sans KR", sans-serif'; cx.fillStyle = '#63685C';
  cx.fillText(v.ref + ' (개역한글)', W / 2, y + 26);
  cx.font = '500 30px "Noto Sans KR", sans-serif'; cx.fillStyle = '#C08B3E';
  cx.fillText('🌱 말씀 한 그루 · 다시봄', W / 2, H - 64);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const file = new File([blob], '말씀카드.png', { type: 'image/png' });
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: '오늘의 말씀' }); FXS('send'); return; } catch(e) {}
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = '말씀카드_' + todayKey(now()) + '.png';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  S.cardMsg = '말씀카드를 저장했어요. 가족·교우들께 보내보세요 💌'; FXS('reward'); render();
}

/* 파티클 — 나무 위 물방울(급수)·성장 축포(레벨업)·필사 완료 반짝임 */
function particles(kind, anchorId){
  const box = document.getElementById(anchorId || 'tree-box');
  if (!box) return;
  const N = kind === 'burst' ? 12 : 6;
  const EMO = kind === 'burst' ? ['🌿','✨','🕊️','💚'] : (kind === 'sparkle' ? ['✨','🌟'] : ['💧']);
  for (let i = 0; i < N; i++) {
    const s = document.createElement('span');
    s.className = 'fx-p';
    s.textContent = EMO[i % EMO.length];
    const x = 26 + Math.random() * 48; // %
    if (kind === 'drop') {
      s.style.cssText += `left:${x}%;top:18%;animation:fxDrop ${0.7+Math.random()*0.4}s ease-in ${i*0.12}s both`;
    } else {
      const ang = (i / N) * Math.PI * 2, dist = 42 + Math.random() * 34;
      s.style.cssText += `left:48%;top:42%;--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist-18}px;--rot:${(Math.random()*80-40).toFixed(0)}deg;animation:fxBurst ${0.9+Math.random()*0.4}s ease-out ${i*0.05}s both`;
    }
    box.appendChild(s);
    setTimeout(() => s.remove(), 2400);
  }
}

  const routeSteps = exodusDone ? total - perStop*12 : total;
  const pos = Math.min(11, Math.floor(routeSteps / perStop));
  const inStop = routeSteps % perStop;
  const steps = route.stops.map((st,i)=>{
    const done = i < pos, cur = i === pos;
    const open = S.journeyOpen === i;
    return `<div style="opacity:${i>pos?.45:1}">
      <button onclick="S.journeyOpen=${open?'null':i};render()" ${i>pos?'disabled':''} style="width:100%;border:0;background:transparent;color:inherit;text-align:left;display:flex;align-items:center;gap:13px;padding:11px 0;${i>pos?'cursor:default':''}">

        </div>
        ${done||cur?`<div style="color:var(--ink2)">${open?'▲':'▼'}</div>`:''}
      </button>
      ${open&&i<=pos?`<div style="margin:0 0 10px 43px;background:var(--soft);border-radius:14px;overflow:hidden;animation:rise .3s ease both">
        ${(JOURNEY_IMG[exodusDone?'paul':'exodus'][i])?`<img class="paint" src="img/${JOURNEY_IMG[exodusDone?'paul':'exodus'][i]}" style="height:110px" alt="">

        </div>

  return `<div style="padding:54px 22px 28px">

    <div class="cap" style="margin-top:7px">${esc(route.intro)}</div>

          <div class="tag" style="color:var(--olive)">${exodusDone?'두 번째 여정 · 바울의 길':'첫 번째 여정 · 출애굽'}</div>
          <div class="cap">${pos}/12 지점 · 총 ${total}걸음</div>
        </div>
        <div style="margin-top:12px;height:6px;border-radius:6px;background:var(--chip);overflow:hidden">
          <div style="width:${Math.min(100,(pos+inStop/perStop)/12*100)}%;height:100%;background:var(--gold)"></div>

    </div>
    <div class="cap" style="margin-top:12px;text-align:center">${exodusDone?'로마까지 완주하면 순례 기념장이 남아요 🏛️':'완주하면 「사도 바울 전도여행」이 열려요 🏛️'}</div>

}

/* ── 기도 탭 (다시봄 호스트=Firestore 실연동, 그 외=로컬 시안) ── */
const IS_DSB = /dasibomlife\.com|mylife-650f0/.test(location.host);
const BAD_WORDS = ['시발','씨발','개새','병신','지랄','좆','섹스','미친년','미친놈','꺼져'];
let fbReady = null;
function fbInit(){
  if (fbReady) return fbReady;
  fbReady = new Promise((resolve, reject) => {
    const srcs = ['https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js',
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js'];
    (function next(i){
      if (i >= srcs.length){
        try{
          if (!firebase.apps.length) firebase.initializeApp({ apiKey:'AIzaSyAZAhBAsrKcXnznnx8_0oF2gyYC0WbvoP0',
            authDomain:'mylife-650f0.firebaseapp.com', projectId:'mylife-650f0' });
          firebase.auth().onAuthStateChanged(u => { if (u) resolve(u); else firebase.auth().signInAnonymously().catch(reject); });
        }catch(e){ reject(e); }
        return;
      }
      const s = document.createElement('script'); s.src = srcs[i];
      s.onload = () => next(i+1); s.onerror = () => reject(new Error('sdk'));
      document.head.appendChild(s);
    })(0);
  });
  return fbReady;
}
let livePrayers = null; // null=미로딩, 'loading', 배열
async function loadPrayers(){
  livePrayers = 'loading'; render();
  try{
    await fbInit();
    const qs = await firebase.firestore().collection('bible_prayers').orderBy('createdAt','desc').limit(20).get();
    livePrayers = qs.docs.map(d => ({ id:d.id, ...d.data() }));
  }catch(e){ livePrayers = []; }
  render();
}
function relTime(ts){
  try{ const ms = Date.now() - ts.toDate().getTime();
    if (ms < 60e3) return '방금'; if (ms < 3600e3) return Math.floor(ms/60e3)+'분 전';
    if (ms < 86400e3) return Math.floor(ms/3600e3)+'시간 전'; return Math.floor(ms/86400e3)+'일 전';
  }catch(e){ return ''; }
}
async function 올리기라이브(){
  const el = document.getElementById('pray-input');
  const t = (el && el.value || '').trim();
  if (!t){ S.prayHint = !S.prayHint; FXS('nope'); render(); return; }
  if (t.length > 200){ S.prayMsg = '200자까지 적을 수 있어요'; FXS('nope'); render(); return; }
  if (BAD_WORDS.some(w => t.includes(w))){ S.prayMsg = '고운 말로 다시 적어 주세요'; FXS('nope'); render(); return; }
  const nick = localStorage.getItem('userName');
  if (!nick){ S.prayMsg = '다시봄 홈에서 로그인하면 올릴 수 있어요'; FXS('nope'); render(); return; }
  S.prayMsg = ''; S.prayHint = false; S.praySending = true; render();
  try{
    const u = await fbInit();
    await firebase.firestore().collection('bible_prayers').add({
      uid: u.uid, nick: nick.slice(0,30), text: t, amens: {},
      createdAt: firebase.firestore.FieldValue.serverTimestamp() });

    await loadPrayers();
  }catch(e){ S.praySending = false; S.prayMsg = '지금은 올릴 수 없어요. 잠시 후 다시 시도해 주세요'; render(); }
}
async function 아멘(pid){
  try{
    const u = await fbInit();
    const p = (livePrayers||[]).find(x => x.id === pid);
    if (!p || (p.amens && p.amens[u.uid])) return;
    await firebase.firestore().collection('bible_prayers').doc(pid).update({ ['amens.'+u.uid]: true });
    p.amens = Object.assign({}, p.amens, { [u.uid]: true });
    FXS('send');
    render();
  }catch(e){}
}

        🙏 ${mine?'아멘 했어요':'아멘'} · ${n}</button>

  return `<div style="padding:54px 22px 28px">
    <div class="h1">기도</div>

          ${S.prayHint?`<div class="cap" style="color:var(--gold)">한 줄만 적어 주세요</div>`:''}
          ${S.prayMsg?`<div class="cap" style="color:var(--gold)">${esc(S.prayMsg)}</div>`:''}
          <button onclick="올리기라이브()" ${S.praySending?'disabled':''} class="btn" style="padding:10px 20px;border-radius:999px;font-size:12.5px">${S.praySending?'올리는 중…':'올리기'}</button></div>
      </div>`:`<div style="padding:16px 18px 18px;text-align:center">
        <div class="cap">다시봄에 이름으로 로그인하면 기도를 올리고 아멘할 수 있어요</div>
        <a href="/" style="display:inline-block;margin-top:10px;text-decoration:none" class="btn">다시봄 홈에서 로그인하기</a>

    <div style="margin-top:11px;display:flex;flex-direction:column;gap:11px">
      ${livePrayers==='loading'?'<div class="cap" style="text-align:center;padding:20px">기도를 모아오는 중…</div>':(cards||'<div class="cap" style="text-align:center;padding:20px">아직 올라온 기도가 없어요. 첫 기도를 남겨보세요.</div>')}
    </div>
  </div>`;
